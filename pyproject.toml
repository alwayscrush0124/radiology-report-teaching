[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "radiology-report-teaching-atlas"
version = "0.1.0"
description = "Local-first MVP for creating conversation-anchored radiology report teaching cards."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["streamlit>=1.40,<2"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
